[project]
name = "llmlog"
version = "0.1.0"
description = "Drop-in durable telemetry for LLM calls. Provider-agnostic."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llmlog*"]
