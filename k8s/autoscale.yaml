# Backend autoscaling.
#
# This used to be a KEDA ScaledObject scaling queue consumers on Redis backlog
# depth — the right signal when a queue existed. Ingestion is now a synchronous
# write inside the API, so there is no backlog to read and no separate consumer
# to scale. What remains is a plain request-serving deployment, and CPU is an
# honest signal for that.
#
# Note that ingestion load does not translate into dropped telemetry under
# pressure: producers spool to disk and replay, so a slow scale-up delays
# events rather than losing them.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-cpu
  namespace: llm-logs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Well above a request spike so traffic bursts do not thrash replicas.
      stabilizationWindowSeconds: 300
